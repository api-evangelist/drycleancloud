components:
  responses:
    Unauthorized:
      description: Missing or invalid api_token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AuthBody:
      type: object
      required:
        - api_token
      properties:
        api_token:
          type: string
          description: >-
            Per-account API token from Settings > Admin > Pickup and Delivery >
            API. Required on every request.
    Error:
      type: object
      properties:
        Error:
          type: string
        Success:
          type: string
    SuccessResponse:
      type: object
      properties:
        Success:
          type: string
          description: Typically "True" on success.
    CustomerInput:
      type: object
      properties:
        customerName:
          type: string
        customerTel:
          type: string
        customerEmail:
          type: string
        customerAddress:
          type: string
        customerPassword:
          type: string
    Customer:
      type: object
      properties:
        id:
          type: string
        customerName:
          type: string
        customerTel:
          type: string
        customerEmail:
          type: string
        customerAddress:
          type: string
        credit:
          type: number
        loyaltyPoints:
          type: integer
    CustomerResponse:
      type: object
      properties:
        Success:
          type: string
        customerID:
          type: string
    OrderProduct:
      type: object
      properties:
        productID:
          type: string
        quantity:
          type: integer
        price:
          type: number
    Order:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        finalTotal:
          type: number
        orderStatus:
          type: string
        paid:
          type: boolean
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderProduct'
    OrderResponse:
      type: object
      properties:
        Success:
          type: string
        orderID:
          type: string
    Garment:
      type: object
      properties:
        barcode:
          type: string
        orderID:
          type: string
        color:
          type: string
        notes:
          type: string
        location:
          type: string
        status:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        category:
          type: string
        parentID:
          type: string
