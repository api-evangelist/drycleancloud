aid: drycleancloud
url: https://raw.githubusercontent.com/api-evangelist/drycleancloud/refs/heads/main/apis.yml
name: CleanCloud
kind: company
description: CleanCloud is cloud-based point-of-sale (POS) and business management
  software for dry cleaners, laundromats, laundry services, and shoe repair
  businesses. It handles orders, garment tracking, customers, pickup and delivery
  routing, payments, inventory, marketing, and reporting. CleanCloud exposes a
  documented public REST API (base https://cleancloudapp.com/api) for programmatic
  access to customers, orders, garments, products, price lists, inventory, pickup
  and delivery scheduling, payments, subscriptions, invoices, promotions, and
  reporting, plus outbound Webhooks for order and customer events. API access is
  available on the Grow and Grow+ subscription tiers, authenticated with a
  per-account API token and metered at 50,000 requests per month (max 3 requests
  per second).
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Dry Cleaning
- Laundry
