aid: drycleancloud
name: CleanCloud
review:
  question: Does CleanCloud expose a documented public WebSocket API?
  answer: false
  date: '2026-07-04'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. CleanCloud's public developer surface is
    a request/response REST API over HTTPS (all endpoints are POST with a JSON
    body to https://cleancloudapp.com/api). Its only event-driven, server-push
    mechanism is outbound Webhooks: CleanCloud HTTP-POSTs a payload to a
    merchant-configured URL when an order or customer event occurs. Webhooks are
    server-to-endpoint HTTP callbacks, not a WebSocket transport, and there is no
    inbound streaming or bidirectional socket to model.
findings:
  summary: |
    CleanCloud does not publish a documented public WebSocket API. CleanCloud is
    cloud-based point-of-sale and business-management software for dry cleaners,
    laundromats, laundry services, and shoe repair. It exposes a real, documented
    public REST API at https://cleancloudapp.com/api. Every endpoint is an HTTPS
    POST that takes a JSON body and returns JSON. Authentication is a per-account
    API token supplied as the `api_token` field in the request body (issued under
    Settings > Admin > Pickup and Delivery > API). API access is gated to the
    Grow and Grow+ subscription tiers (Pro in Mexico) and is metered at 50,000
    requests per month with a maximum of 3 requests per second; additional
    25,000-request bundles are sold at about $15. The only push mechanism is
    outbound Webhooks (10 events), which are HTTP callbacks, not WebSockets. No
    ws:// or wss:// endpoint is documented anywhere in CleanCloud's API page or
    Help Centre.
  openSource: |
    CleanCloud is proprietary, closed-source commercial SaaS. There is no public
    source repository or self-hostable engine; consumers integrate against the
    hosted https://cleancloudapp.com/api service.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://cleancloudapp.com/api
      documented: true
      note: All endpoints are HTTPS POST with a JSON body, authenticated via the api_token body field. Returns JSON.
    - protocol: Webhook
      scheme: https
      documented: true
      note: >-
        Outbound webhooks POST an event payload to a merchant-configured URL.
        10 events - order.created (in-store), order.created (pickup and
        delivery), order.status_changed, order.pickup_rescheduled,
        order.delivery_rescheduled, order.nothing_to_pickup, order.deleted,
        customer.created, customer.updated, customer.deleted. Server-to-endpoint
        HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in CleanCloud's API page or Help Centre as of the review date.
