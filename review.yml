actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. CleanCloud's public API is
    request/response REST (HTTPS POST + JSON), and its only event-driven
    mechanism is outbound Webhooks (HTTP callbacks). No AsyncAPI document was
    created because there is no server-push socket transport on CleanCloud's own
    API to model; the webhook callbacks are plain HTTP POSTs to a merchant URL
    and are documented in apis.yml and this review instead.
